<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — काम Khoj.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/admin.css">
  <script>try{if(localStorage.getItem('wfc_theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
  <style>
    /* ---- Login-specific overrides ---- */
    body { margin: 0; min-height: 100vh; display: flex; background: var(--bg-primary); }
    .login-split { display: flex; width: 100%; min-height: 100vh; }

    /* Left: animated mesh */
    .login-left {
      flex: 1; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
      background: linear-gradient(135deg, var(--admin-sidebar-bg) 0%, var(--admin-card-bg) 100%);
    }
    .mesh-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(var(--accent-rgb), 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--accent-rgb), 0.08) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: meshDrift 20s linear infinite;
    }
    @keyframes meshDrift {
      from { transform: translate(0,0); }
      to   { transform: translate(60px,60px); }
    }
    .mesh-glow {
      position: absolute; width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--accent-rgb), 0.12) 0%, transparent 70%);
      animation: glowFloat 8s ease-in-out infinite alternate;
    }
    .mesh-glow:nth-child(2) { width: 300px; height: 300px; animation-delay: -4s; animation-duration: 10s; }
    @keyframes glowFloat {
      0%   { transform: translate(-50%, -50%) scale(1); }
      100% { transform: translate(50%, 30%) scale(1.3); }
    }
    .login-left-content {
      position: relative; z-index: 2; text-align: center; padding: 2rem;
    }
    .login-left-content h2 {
      font-family: 'Barlow Condensed', sans-serif; font-size: 3rem;
      font-weight: 700; text-transform: uppercase; letter-spacing: 3px;
      color: var(--admin-text); margin-bottom: 1rem;
    }
    .login-left-content h2 span { color: var(--accent, #2fbf71); }
    .login-left-content p {
      color: var(--admin-muted); font-size: 1rem; max-width: 320px; margin: 0 auto;
    }

    /* Right: form card */
    .login-right {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 2rem; background: var(--bg-primary);
    }
    .login-card {
      width: 100%; max-width: 400px; background: var(--admin-card-bg);
      backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px; padding: 2.5rem 2rem;
      animation: loginCardIn 0.8s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes loginCardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .login-badge {
      display: inline-block; padding: 4px 14px; border-radius: 20px;
      background: rgba(var(--accent-rgb), 0.12); border: 1px solid rgba(var(--accent-rgb), 0.25);
      color: var(--accent, #2fbf71); font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem; font-weight: 500; letter-spacing: 2px;
      text-transform: uppercase; margin-bottom: 1.5rem;
    }
    .login-card h1 {
      font-family: 'Barlow Condensed', sans-serif; font-size: 1.8rem;
      font-weight: 700; color: var(--admin-text); margin-bottom: 0.5rem; text-transform: uppercase;
      letter-spacing: 1px;
    }
    .login-card .subtitle {
      color: rgba(255,255,255,0.4); font-size: 0.85rem; margin-bottom: 2rem;
    }
    .field { margin-bottom: 1.25rem; }
    .field label {
      display: block; font-size: 0.75rem; color: var(--admin-muted);
      margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px;
    }
    .field .input-wrap {
      position: relative; display: flex; align-items: center;
      background: var(--bg-primary); border: 1px solid var(--admin-border);
      border-radius: 10px; transition: border-color 0.3s, box-shadow 0.3s;
    }
    .field .input-wrap:focus-within {
      border-color: var(--accent, #2fbf71);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.1);
    }
    .field input {
      flex: 1; background: none; border: none; color: var(--admin-text); padding: 12px 14px;
      font-size: 0.95rem; font-family: 'DM Sans', sans-serif; outline: none;
    }
    .field input::placeholder { color: var(--admin-muted); }
    .toggle-pw {
      background: none; border: none; color: var(--admin-muted);
      cursor: pointer; padding: 0 12px; font-size: 1.1rem; transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--accent, #2fbf71); }
    .login-error {
      display: none; color: var(--danger, #EF4444); font-size: 0.8rem;
      margin-bottom: 1rem; padding: 10px 14px; border-radius: 8px;
      background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.15);
    }
    .login-btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--secondary));
      color: #0d0d0d; font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 2px; cursor: pointer; position: relative; overflow: hidden;
      transition: transform 0.2s, box-shadow 0.3s;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(var(--accent-rgb), 0.25); }
    .login-btn:active { transform: scale(0.98); }
    .login-btn.loading { pointer-events: none; opacity: 0.7; }
    .login-btn .spinner {
      display: none; width: 18px; height: 18px; border: 2px solid rgba(13,13,13,0.3);
      border-top-color: #0d0d0d; border-radius: 50%; animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .login-btn.loading .btn-text { display: none; }
    .login-btn.loading .spinner { display: block; }
    .back-link {
      display: block; text-align: center; margin-top: 1.5rem;
      color: var(--admin-muted); font-size: 0.8rem; text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent, #2fbf71); }

    /* Shake on error */
    .login-card.shake {
      animation: shakeForm 0.5s ease-in-out;
    }
    @keyframes shakeForm {
      0%,100% { transform: translateX(0); }
      20%  { transform: translateX(-12px); }
      40%  { transform: translateX(10px); }
      60%  { transform: translateX(-6px); }
      80%  { transform: translateX(4px); }
    }
    /* Success exit */
    .login-card.exit {
      animation: loginExit 0.6s cubic-bezier(0.55,0,1,0.45) forwards;
    }
    @keyframes loginExit {
      to { opacity: 0; transform: scale(0.92) translateY(-20px); }
    }

    @media (max-width: 768px) {
      .login-split { flex-direction: column; }
      .login-left { min-height: 200px; flex: none; }
      .login-left-content h2 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="login-split">
    <!-- LEFT: Animated mesh -->
    <div class="login-left">
      <div class="mesh-grid"></div>
      <div class="mesh-glow" style="top:30%;left:40%;"></div>
      <div class="mesh-glow" style="top:60%;left:60%;"></div>
      <div class="login-left-content">
        <h2><span class="brand-nepali">काम</span> <span>Khoj.com</span></h2>
        <p>Control panel for platform administrators. Manage workers, clients, and reviews.</p>
      </div>
    </div>

    <!-- RIGHT: Login form -->
    <div class="login-right">
      <div class="login-card" id="login-card">
        <div class="login-badge">🔒 Admin Access</div>
        <h1>Sign In</h1>
        <p class="subtitle">Enter your administrator credentials</p>

        <div class="login-error" id="login-error"></div>

        <form id="admin-login-form" autocomplete="off">
          <div class="field">
            <label for="adm-user">Username</label>
            <div class="input-wrap">
              <input type="text" id="adm-user" placeholder="admin" required>
            </div>
          </div>
          <div class="field">
            <label for="adm-pass">Password</label>
            <div class="input-wrap">
              <input type="password" id="adm-pass" placeholder="••••••••" required>
              <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Toggle password">👁</button>
            </div>
          </div>
          <button type="submit" class="login-btn" id="login-btn">
            <span class="btn-text">Access Dashboard</span>
            <span class="spinner"></span>
          </button>
        </form>
        <a href="../../index.html" class="back-link">← Back to main site</a>
      </div>
    </div>
  </div>

  <script src="../../js/admin.js"></script>
  <script>
    (function() {
      // If already logged in, redirect
      const session = JSON.parse(localStorage.getItem('wfc_admin_session') || 'null');
      if (session && session.loggedIn) {
        window.location.href = 'admin-dashboard.html';
        return;
      }

      const form = document.getElementById('admin-login-form');
      const card = document.getElementById('login-card');
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      const userInput = document.getElementById('adm-user');
      const passInput = document.getElementById('adm-pass');
      const togglePw = document.getElementById('toggle-pw');

      // Toggle password visibility
      togglePw.addEventListener('click', () => {
        const isPassword = passInput.type === 'password';
        passInput.type = isPassword ? 'text' : 'password';
        togglePw.textContent = isPassword ? '🙈' : '👁';
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        errEl.style.display = 'none';
        btn.classList.add('loading');

        const username = userInput.value.trim();
        const password = passInput.value;

        setTimeout(() => {
          if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
            // Success
            card.classList.add('exit');
            localStorage.setItem('wfc_admin_session', JSON.stringify({
              loggedIn: true,
              username: ADMIN_CREDENTIALS.username,
              name: ADMIN_CREDENTIALS.name,
              loginTime: new Date().toISOString()
            }));
            setTimeout(() => {
              window.location.href = 'admin-dashboard.html';
            }, 600);
          } else {
            // Error
            btn.classList.remove('loading');
            errEl.textContent = 'Invalid credentials. Please try again.';
            errEl.style.display = 'block';
            card.classList.remove('shake');
            void card.offsetWidth; // reflow to retrigger
            card.classList.add('shake');
            passInput.value = '';
            passInput.focus();
          }
        }, 800);
      });
    })();
  </script>
  <button class="theme-toggle" id="theme-toggle-btn" role="switch" aria-checked="false" aria-label="Toggle dark/light mode" title="Toggle dark/light mode">
    <span class="theme-toggle-icon theme-toggle-sun" aria-hidden="true">&#9728;</span>
    <span class="theme-toggle-icon theme-toggle-moon" aria-hidden="true">&#9790;</span>
    <span class="theme-toggle-knob" aria-hidden="true"></span>
  </button>
  <script>(function(){var btn=document.getElementById('theme-toggle-btn');if(!btn)return;var isLight=localStorage.getItem('wfc_theme')==='light';btn.setAttribute('aria-checked',isLight?'true':'false');btn.addEventListener('click',function(){var l=document.documentElement.getAttribute('data-theme')!=='light';l?document.documentElement.setAttribute('data-theme','light'):document.documentElement.removeAttribute('data-theme');btn.setAttribute('aria-checked',l?'true':'false');localStorage.setItem('wfc_theme',l?'light':'dark');});})();</script>
</body>
</html>
